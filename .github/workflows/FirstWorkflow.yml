name: My First Workflow
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  first_job:
    name: My first job
    runs-on: ubuntu-latest
    steps:
      - name: Great the user
        run: |
          echo "Hello world from ${{ vars.My_VARIABLE }}!"
          echo "My secret is branch is ${{ secrets.MY_SECRET }}"
        shell: bash

      - name: Checkout
        uses: actions/checkout@v6.1.0

      - run: tree
  Test:
    runs-on: ubuntu-latest
    environment: Test
    needs: first_job
    steps:
      - run: |
          echo "Hello world from  ${{ vars.My_VARIABLE }}!"
          sec=$(echo ${{ secrets.MY_SECRET }}| sed 's/./& /g')
          echo "My secre is $sec"

  Load-Test:
    runs-on: ubuntu-latest
    environment: Load_Test
    needs:  first_job
    steps:
      - run: |
          echo "Hello world from  ${{ vars.My_VARIABLE }}!"
          sec=$(echo ${{ secrets.MY_SECRET }}| sed 's/./& /g')
          echo "My secre is $sec"

  Production:
    runs-on: ubuntu-latest
    environment: Production
    needs: 
      - first_job
      - Load-Test
    steps:
      - run: |
          echo "Hello world from  ${{ vars.My_VARIABLE }}!"
          sec=$(echo ${{ secrets.MY_SECRET }}| sed 's/./& /g')
          echo "My secre is $sec"
